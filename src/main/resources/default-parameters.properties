debug=false
showAbout=false

bufferedFileStreams=false

#VLC priority path
vlcPath=

#Use old player (new one requires Java 14+)
oldPlayerMode=false

#Name of root directory (don't set to an actual path in your system or you won't be able to access it via address field)
ROOT_NAME=root

#Multi-threading load for specific tasks
maxThreadsForTask=8



#Path string mangling
#Current number in the list
filter.number=#

#File name without extension
filter.nameNoExtension=<nne>

#File name with extension
filter.name=<n>

#File name extension 
filter.nameExtension=<ne>

#All path filters have no file separator at the end
#File absolute path 
filter.path=<ap>

#File parent 1 level up
filter.parent1=<p1>

#File parent 2 level up
filter.parent2=<p2>
#
#    Path mangling example for file /home/user/documents/doc.txt
#    path                = /home/user/documents/doc.txt
#    parent1             = /home/user/documents
#    parent2             = /home/user
#    name                = doc.txt
#    nameNoExtention     = doc
#    nameExtension       = txt



#Custom path

filter.custom=<c>
filter.relativeCustom=<rc>
code.setCustom=setCustom
#  
#    Relative to custom path
#    Example:
#    custom = folder1/folder2
#    path = folder1/folder2/folder3/file.txt
#    relativeCustom = folder3/file.txt
#    


#Multi-threading for commands-line tasks
code.maxThreadsForCommand=4


code.listParameters=listParam
#clear screen
code.clear=clear
#truncate command text window after specified length
code.truncateAfter=1000000
#command to generate script
code.commandGenerate=generate
#command to load script
code.commandApply=apply
#reinitialize application
code.init=init
#list all files that have specified folder as parent
code.list=list
#recursive list
code.listRec=listRec
#copy structure of a src folder to custom path
code.copyFolderStructure=copyStructure
#cancel all current tasks
code.cancel=cancel

virtualPrefix=V

